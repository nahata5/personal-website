[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.95.0"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# VentSim alias: tomnahass.com/vent-sim/ proxies the separate Netlify site (vent-sim README, D-008).
[[redirects]]
  from = "/vent-sim"
  to = "/vent-sim/"
  status = 301

[[redirects]]
  from = "/vent-sim/*"
  to = "https://vent-sim.netlify.app/:splat"
  status = 200

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
